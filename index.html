<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Birthday Room</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Birthday room game">
      <section class="stage" aria-label="Pixel room">
        <canvas id="game" width="240" height="320"></canvas>
        <div class="hud" aria-live="polite">
          <div class="title">Muthu's Birthday Party!</div>
          <div id="hint" class="hint">...</div>
        </div>
        <div id="dialogue" class="dialogue" hidden></div>
        <div id="musicPanel" class="music-panel" hidden>
          <div class="panel-top">
            <div>
              <div class="panel-label">Music Player</div>
              <div class="track-name">Spotify playlist</div>
            </div>
            <button id="closeMusic" class="icon-button" type="button" aria-label="Close music player">x</button>
          </div>
          <div id="spotifySlot" class="spotify-slot" aria-label="Spotify embed area">
            <div class="empty-embed">
              Spotify playlist
            </div>
          </div>
        </div>
        <div id="tvPanel" class="room-panel tv-panel" hidden>
          <div class="panel-top">
            <div>
              <div class="panel-label">TV Picks</div>
              <div class="track-name">Birthday watchlist</div>
            </div>
            <button id="closeTv" class="icon-button" type="button" aria-label="Close TV picks">x</button>
          </div>
          <div id="tvCarousel" class="tv-carousel"></div>
          <div class="tv-actions">
            <button id="prevRecommendation" type="button">Prev</button>
            <a id="openTraktList" class="tv-link" href="https://app.trakt.tv/users/abithav/lists/hbd" target="_blank" rel="noopener noreferrer">Open Trakt</a>
            <button id="nextRecommendation" type="button">Next</button>
          </div>
        </div>
        <div id="cardPanel" class="room-panel card-panel" hidden>
          <div class="panel-top">
            <div>
              <div class="panel-label">Greeting Card</div>
              <div class="track-name">A birthday note</div>
            </div>
            <button id="closeCard" class="icon-button" type="button" aria-label="Close greeting card">x</button>
          </div>
          <div id="cardMessage" class="card-message"></div>
        </div>
        <div id="consolePanel" class="room-panel console-panel" hidden>
          <div class="panel-top">
            <div>
              <div class="panel-label">Mini Console</div>
              <div class="track-name">Catch the Sparkle</div>
            </div>
            <button id="closeConsole" class="icon-button" type="button" aria-label="Close mini game">x</button>
          </div>
          <div class="mini-game-stats">
            <span>Score <strong id="miniScore">0</strong></span>
            <span>Time <strong id="miniTime">15</strong></span>
          </div>
          <div id="miniGrid" class="mini-grid" aria-label="Catch the sparkle game"></div>
          <button id="startMiniGame" type="button">Start</button>
        </div>
        <div class="touch-controls" aria-label="Touch controls">
          <div class="dpad" aria-label="Move">
            <button class="touch-button dpad-up" type="button" data-hold-key="arrowup" aria-label="Move up">▲</button>
            <button class="touch-button dpad-left" type="button" data-hold-key="arrowleft" aria-label="Move left">◀</button>
            <button class="touch-button dpad-right" type="button" data-hold-key="arrowright" aria-label="Move right">▶</button>
            <button class="touch-button dpad-down" type="button" data-hold-key="arrowdown" aria-label="Move down">▼</button>
          </div>
          <button class="touch-button interact-button" type="button" data-action="interact" aria-label="Interact">E</button>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
